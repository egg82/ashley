# CI for Ashley: the suite, the pyright gate and the client checks on every pull request and every push to main, while
# the app image and the content-hashed images build beside them. On main, once everything is green, `release` tags the
# app image already pushed by digest: `dev` (fetcharr's tag for main) and `main-<sha8>-<commit-timestamp>`, the tag
# Flux image automation sorts on. Pull requests build every image and push none.
#
# Images go to Docker Hub (`docker.io/<vars.DOCKERHUB_USERNAME>/…`, logged in with `secrets.DOCKERHUB_TOKEN`) and GHCR
# (`ghcr.io/<owner>/…`, logged in with GITHUB_TOKEN), named as egg82/fetcharr's workflows name them. linux/amd64 only:
# every node that runs Ashley is amd64, and her images' Python wheels, build123d's OCP and Proton Bridge's release have no
# ppc64le builds.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The owner stands in where the variable is unset (a fork's pull request), so the names still parse.
  DOCKERHUB_REPO: docker.io/${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # The suite on the Postgres major production runs (18, with pgvector) and the etcd release the referee runs. Each
  # shard takes every SHARDS-th test file in name order, so the shards together run exactly the files pytest collects.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARDS: 8
      CI: "true"
      TIME_GATE: "1"   # tests/time_gate.py judges only here; tests/test_time_gate.py fails under CI without it
      # Wall-clock ceilings over setup + call + teardown: per test, and per fixture shared across tests.
      TEST_CEILING_S: "2.0"
      TEST_SHARED_CEILING_S: "10.0"
      # tests/test_household_names.py: the household's names, held only as this secret; unset (forks), it skips.
      ASHLEY_HOUSEHOLD_NAMES: ${{ secrets.ASHLEY_HOUSEHOLD_NAMES }}
      ASHLEY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1/postgres
      ASHLEY_TEST_ETCD_URL: http://127.0.0.1:2379
      ASHLEY_TEST_DEX_URL: http://127.0.0.1:5556/dex
    steps:
      - uses: actions/checkout@v4

      # Started by hand, not as `services:`, which cannot pass a command: Postgres takes throwaway-data settings, etcd
      # listens beyond localhost, and Dex reads the config the checkout holds (its issuer names port 5556).
      - name: Start Postgres, etcd and Dex
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" \
            pgvector/pgvector:0.8.2-pg18 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          docker run -d --name etcd -p 2379:2379 quay.io/coreos/etcd:v3.7.3 \
            etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://127.0.0.1:2379
          docker run -d --name dex -p 5556:5556 -v "$PWD/app/tests/dex/config.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:v2.46.1 dex serve /etc/dex/config.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      # ffmpeg: the media runner's tests run it for real (tests/test_media_runner.py).
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Wait for Postgres, etcd and Dex
        working-directory: app
        run: |
          for _ in $(seq 60); do python -c "import psycopg; psycopg.connect('$ASHLEY_TEST_DATABASE_URL').close()" 2>/dev/null && break; sleep 1; done
          for _ in $(seq 60); do python -c "import httpx2; httpx2.get('$ASHLEY_TEST_ETCD_URL/health').raise_for_status()" 2>/dev/null && break; sleep 1; done
          for _ in $(seq 60); do python -c "import httpx2; httpx2.get('$ASHLEY_TEST_DEX_URL/.well-known/openid-configuration').raise_for_status()" 2>/dev/null && break; sleep 1; done

      - name: Test (shard ${{ matrix.shard }})
        working-directory: app
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(find tests \( -name 'test_*.py' -o -name '*_test.py' \) | LC_ALL=C sort)
          mine=()
          for i in "${!files[@]}"; do
            if (( i % SHARDS == SHARD )); then mine+=("${files[$i]}"); fi
          done
          echo "shard $SHARD of $SHARDS: ${#mine[@]} of ${#files[@]} test files"
          test "${#mine[@]}" -gt 0
          python -m pytest -q -n 2 --durations=25 --durations-min=1 "${mine[@]}"

  # Pyright's error count against the held one in app/tools/held/pyright.json: it may only go down.
  pyright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - working-directory: app
        run: python tools/pyright_gate.py

  # The client's generated API types in step with openapi.json, its TypeScript, its tests, and that it builds.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run types:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The app image, built beside the tests. On main it is pushed by digest alone, a tag Flux never sees; `release` names
  # it once everything is green.
  app-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and on main push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Containerfile
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,"name=${{ env.DOCKERHUB_REPO }}/ashley,${{ env.GHCR_REPO }}/ashley",push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The images other pods run, each tagged by a hash of what it bakes in (app/tools/ci_image_hash.py). Built only when a
  # registry lacks that tag; the CAD and mail bridge images run their tests inside the image, as their pods run it,
  # before anything is pushed. The cluster repo pins their digests.
  hashed-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ashley-look
            flag: --look
            context: deploy/look
          - image: ashley-media
            flag: --media
            context: deploy/media
          - image: ashley-cad
            flag: --cad
            context: deploy/cad
          - image: ashley-mail-bridge
            flag: --bridge
            context: deploy/mail-bridge
    steps:
      - uses: actions/checkout@v4

      - name: Is this hash new?
        id: want
        run: |
          HASH=$(python3 app/tools/ci_image_hash.py ${{ matrix.flag }})
          LOCAL="${{ matrix.image }}:$HASH"
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          for repo in "$DOCKERHUB_REPO" "$GHCR_REPO"; do
            if ! docker buildx imagetools inspect "$repo/$LOCAL" > /dev/null 2>&1; then
              echo "$repo/$LOCAL is missing: building"
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "$LOCAL is in both registries: nothing to build"
          echo "build=false" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.want.outputs.build == 'true'
        run: >
          docker build --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          -f ${{ matrix.context }}/Containerfile -t "${{ steps.want.outputs.local }}" ${{ matrix.context }}

      # As the sandbox runs it: read-only root, no network, uid 65534, over real model files and the print settings the
      # app ships.
      - name: Test the CAD helper in its image
        if: steps.want.outputs.build == 'true' && matrix.image == 'ashley-cad'
        run: >
          docker run --rm --read-only --network=none --user 65534 --tmpfs /work:rw,mode=1777 -w /work -e HOME=/work
          -v "$PWD/deploy/cad/test_ashley_cad.py:/test/test_ashley_cad.py:ro"
          -v "$PWD/deploy/cad/test_ashley_print.py:/test/test_ashley_print.py:ro"
          -v "$PWD/deploy/cad/test_ashley_facts_blind.py:/test/test_ashley_facts_blind.py:ro"
          -v "$PWD/app/tests/cad_models:/test/models:ro" -v "$PWD/app/ashley/workshop/print.json:/test/print.json:ro"
          "${{ steps.want.outputs.local }}" python -m unittest discover -v -s /test

      # As the pod runs it: read-only root, uid 1000. The keeper runs against a real Bridge.
      - name: Test the keeper in its image
        if: steps.want.outputs.build == 'true' && matrix.image == 'ashley-mail-bridge'
        run: >
          docker run --rm --read-only --user 1000 --tmpfs /tmp:rw,mode=1777 --tmpfs /home/bridge:rw,mode=1777
          -v "$PWD/deploy/mail-bridge/test_keeper_image.py:/test/test_keeper_image.py:ro"
          --entrypoint /opt/venv/bin/python "${{ steps.want.outputs.local }}"
          -m unittest discover -v -s /test

      - name: Log in to Docker Hub
        if: steps.want.outputs.build == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.want.outputs.build == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: steps.want.outputs.build == 'true' && env.PUBLISH == 'true'
        env:
          LOCAL: ${{ steps.want.outputs.local }}
        run: |
          for repo in "$DOCKERHUB_REPO" "$GHCR_REPO"; do
            docker tag "$LOCAL" "$repo/$LOCAL"
            docker push "$repo/$LOCAL"
          done

  # The one check branch protection requires. A skipped required check counts as passed, and a job whose need failed is
  # skipped, so this runs always and fails unless every job it needs succeeded.
  ci-ok:
    if: always()
    needs: [tests, pyright, web, app-image, hashed-images]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # The pushed digest under its deployable names: a manifest copy inside each repository, so no layer moves.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-ok, app-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Flux's ImagePolicy sorts tag strings, so the commit timestamp must not go backwards.
      - name: Name the tag
        id: tag
        run: |
          TS=$(git show -s --format=%ct HEAD)
          PREV_TS=$(git show -s --format=%ct HEAD~1 2>/dev/null || echo 0)
          if [ "$TS" -lt "$PREV_TS" ]; then
            echo "REFUSING: commit timestamp $TS is older than its parent's $PREV_TS." >&2
            echo "Image tags would sort backwards and Flux would not deploy this commit." >&2
            exit 1
          fi
          echo "tag=main-${GITHUB_SHA::8}-$TS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag dev and ${{ steps.tag.outputs.tag }}
        env:
          DIGEST: ${{ needs.app-image.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          test -n "$DIGEST"
          for repo in "$DOCKERHUB_REPO/ashley" "$GHCR_REPO/ashley"; do
            docker buildx imagetools create -t "$repo:dev" -t "$repo:$TAG" "$repo@$DIGEST"
          done
          echo "released $TAG"
