# CI's health, nightly: app/tools/ci_health.py reads the last week of pull-request runs of `CI`, compares their wall
# clock with the per-PR budget in docs/engineering.md ("Scope and test budget"), and lists the runs that passed on a
# rerun after their first attempt failed a test job. Over budget, or any such rerun, it keeps one open issue per problem
# (labels ci-health-budget, ci-health-reruns), replacing the body each night rather than opening another.

name: CI health

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  readout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read the last week of pull-request runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 app/tools/ci_health.py --repo "${{ github.repository }}" --budget-min 5
