plugins {
    id 'com.android.application'
}

// The site the app opens: the host of the deployment's PUBLIC_URL, e.g. `-PashleyHost=ashley.example.com`. Each
// deployment builds its own APK, so the host is never in the tree.
def ashleyHost = findProperty('ashleyHost') ?: { throw new GradleException('pass -PashleyHost=<the host of PUBLIC_URL>') }()

android {
    namespace = 'io.github.egg82.ashley'
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        // ashley.web.assetlinks.PACKAGE names the same package.
        applicationId = 'io.github.egg82.ashley'
        minSdk = 26
        targetSdk = 36
        // A release build passes both from the tag (.github/workflows/android.yml); other builds keep these.
        versionCode = (findProperty('ashleyVersionCode') ?: '1') as int
        versionName = findProperty('ashleyVersionName') ?: '0.1.0'
        manifestPlaceholders = [ashleyHost: ashleyHost]
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
