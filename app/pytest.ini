[pytest]
pythonpath = . tools tests tests/contract tests/bench_jobs_blind tests/herdr_bridge_blind ../bridge/herdr ../deploy/mail-bridge
testpaths = tests
addopts = -n 4 -p no:cacheprovider
timeout = 120
timeout_method = thread
markers =
    reads_docs: reads docs/ or the repo's top-level markdown, so a docs-only pull request runs it
